<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用 8 道题复习 HTML、CSS 和 JavaScript，即时反馈，轻松查漏补缺。">
  <title>知一 · 前端小测</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232d58ed'/%3E%3Ctext x='6' y='24' font-size='23' fill='white'%3E?%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="questions.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="./index.html">
      <span class="brand-icon">知</span>
      知一
      <span class="brand-note">/ 每次学懂一点</span>
    </a>
    <span class="header-tag">FRONTEND QUIZ</span>
  </header>

  <main>
    <div class="eyebrow">
      <span></span>
      学习练习室
      <span class="slash">/</span>
      第 01 期
    </div>

    <div class="page-heading">
      <div>
        <h1>前端基础小测</h1>
        <p>让学过的知识，变成真正掌握的知识。</p>
      </div>
      <span class="topic-tag">&lt;/&gt; WEB 基础</span>
    </div>

    <div class="layout">
      <section id="quiz" class="card" aria-label="测验区域"></section>

      <aside>
        <section class="side-card">
          <span class="small-label">本次挑战</span>
          <h2>小测验，大进步。</h2>
          <p>
            从页面结构到交互逻辑，<br>
            检查你的前端基础知识。
          </p>

          <div class="topics">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
          </div>

          <hr>

          <div class="rule">
            <b>01</b>
            <div>
              <strong>选出你的答案</strong>
              <p>每道题只有一个正确选项。</p>
            </div>
          </div>

          <div class="rule">
            <b>02</b>
            <div>
              <strong>即时反馈，及时理解</strong>
              <p>查看正确答案和知识点解析。</p>
            </div>
          </div>

          <div class="rule">
            <b>03</b>
            <div>
              <strong>完成后回顾</strong>
              <p>所有答题记录，一目了然。</p>
            </div>
          </div>
        </section>

        <div class="note">
          <span>✦</span>
          <p>
            答错也没关系。<br>
            每一次反馈，都是进步的起点。
          </p>
        </div>
      </aside>
    </div>

    <footer>
      <span>保持好奇，持续练习。</span>
      <span>HTML · CSS · JavaScript</span>
    </footer>
  </main>
</body>
</html>
